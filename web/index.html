<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>OpenCode Token Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A//www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0d0f'/%3E%3Cpath d='M17.8 5.5 8 18h5.4L12.6 26.5 23 13.5h-5.6z' fill='%23c8f04e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="shell topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.6 2.5 4.8 13.6h4.6L8.4 21.5l8.8-11.1h-4.6z"/></svg>
      </span>
      <span class="brand-name">Token Tracker</span>
    </div>
    <div class="topbar-right">
      <div class="sync" role="status">
        <span class="sync-dot" id="syncDot" aria-hidden="true"></span>
        <span class="sync-text" id="syncText">Waiting for data</span>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="main">
  <div class="shell">

    <div class="page-head">
      <h1 class="page-title">Usage</h1>
      <div class="range-tabs" id="rangeTabs" role="group" aria-label="Time range">
        <button class="range-tab" type="button" data-range="daily" aria-pressed="false">Daily</button>
        <button class="range-tab" type="button" data-range="weekly" aria-pressed="false">Weekly</button>
        <button class="range-tab" type="button" data-range="monthly" aria-pressed="false">Monthly</button>
        <button class="range-tab" type="button" data-range="all" aria-pressed="true">All time</button>
      </div>
    </div>

    <div class="error-banner" id="errorBanner" role="alert">
      <svg class="banner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <span id="errorBannerMsg">Dashboard server unreachable — retrying…</span>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Token usage</h2>
        <div class="legend" aria-hidden="true">
          <span class="legend-item"><i class="swatch swatch-in"></i>Input</span>
          <span class="legend-item"><i class="swatch swatch-out"></i>Output</span>
        </div>
      </div>
      <div class="chart-frame">
        <div class="chart" id="chart"></div>
        <div class="empty-state" id="chartEmpty">
          <svg class="empty-icon" viewBox="0 0 40 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 20l10-8 6 6 8-12 6 8 8-6"/>
          </svg>
          <p class="empty-title">No token data yet</p>
          <span class="empty-note">Usage will appear here as soon as sessions are recorded.</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title">Usage by model</h2>
      </div>
      <div class="model-frame">
        <div class="model-split" id="modelSplit"></div>
        <div class="empty-state" id="modelEmpty">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="3" y="12" width="4" height="9" rx="1"/>
            <rect x="10" y="7" width="4" height="14" rx="1"/>
            <rect x="17" y="3" width="4" height="18" rx="1"/>
          </svg>
          <p class="empty-title">No model data yet</p>
          <span class="empty-note">Per-model usage will appear here as soon as sessions are recorded.</span>
        </div>
      </div>
    </section>

  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  </svg>
  <span id="toastMsg"></span>
</div>

<script>
/* Theme toggle — part of the T-011 shell, kept self-contained so the
   data layer (app.js) can be rewritten without touching it. Dark is
   the default; the choice is persisted in localStorage. */
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  var saved = null;
  try { saved = window.localStorage.getItem('tt-theme'); } catch (e) { /* storage unavailable */ }
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);

  function syncLabel() {
    var light = root.getAttribute('data-theme') === 'light';
    btn.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
  }
  syncLabel();

  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    syncLabel();
    try { window.localStorage.setItem('tt-theme', next); } catch (e) { /* storage unavailable */ }
  });
})();
</script>
<script src="app.js" defer></script>
</body>
</html>
