[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-token-tracker"
dynamic = ["version"]
description = "Token usage tracker for OpenCode"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
opencode-token-tracker = "tracker.cli:main"

[tool.setuptools.dynamic]
version = {attr = "tracker.__version__"}

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["web/*", "web/vendor/fonts/*", "web/vendor/js/*"]