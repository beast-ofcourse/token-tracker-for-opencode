[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-token-tracker"
version = "0.1.0"
description = "Token usage tracker for OpenCode"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
opencode-token-tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
include = ["tracker*"]